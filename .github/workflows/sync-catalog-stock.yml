# Aligne la disponibilite du flux catalogue Meta sur le stock reel (Supabase).
#
# Meta recharge https://epicerieducoin.fr/catalog.csv chaque jour a 14h37
# (Europe/Paris). On synchronise a 11h00 UTC, soit 12h ou 13h a Paris selon
# la saison : toujours avant l'import, avec de la marge.
#
# Lancable aussi a la main depuis l'onglet Actions (Run workflow).
name: Synchroniser le stock du flux Meta

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-catalog-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Aligner catalog.csv sur le stock
        run: node scripts/sync-catalog-stock.mjs

      - name: Publier si le flux a change
        run: |
          if git diff --quiet -- catalog.csv; then
            echo "Rien a publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.csv
          git commit -m "Synchronise la disponibilite du flux sur le stock reel"
          git push
